services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      POSTGRES_DB: aegis
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis"]
      interval: 3s
      retries: 20
    volumes: [pgdata:/var/lib/postgresql/data]

  backend:
    build: .
    ports: ["8000:8000"]
    env_file: [{ path: .env, required: false }]
    environment:
      DATABASE_URL: postgresql+psycopg://aegis:aegis@postgres:5432/aegis
      MOCK_LLM: ${MOCK_LLM:-true}
      STREAM_PACE_S: ${STREAM_PACE_S:-0.35}
      ALLOW_DEMO_TAMPER: ${ALLOW_DEMO_TAMPER:-true}
      CORS_ORIGINS: "*"
    depends_on:
      postgres: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  pgdata:
